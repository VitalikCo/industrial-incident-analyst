[project]
name = "industrial-incident-analyst"
version = "0.1.0"
description = "Evidence-grounded retrieval and analysis of industrial incident investigation reports"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "requests>=2.32.3,<3",
  "beautifulsoup4>=4.12.3,<5",
  "pydantic>=2.9,<3",
  "PyYAML>=6.0.2,<7",
  "openpyxl>=3.1.5,<4",
  "pymupdf>=1.24,<2",
  "rank_bm25>=0.2.2,<1",
  "openai>=1.40,<2",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.7,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
