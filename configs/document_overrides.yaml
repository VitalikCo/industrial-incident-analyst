# The TPC source PDF has an unreliable embedded text layer. Use the reviewed OCR derivative
# as the text source while retaining the original PDF as the visual/source document.
manual_overrides:
  - match:
      detail_url: https://www.csb.gov/tpc-port-neches-explosions-and-fire/
    document_id: CSB-6203
    investigation_id: 2020-02-I-TX
    incident_ids: [TPC_PORT_NECHES_2019]
    document_type: investigation_report
    corpus_role: primary_incident_evidence
    retrieval_enabled: true
    text_source_path: data/processed/ocr/tpc-port-neches-explosions-and-fire_ocr.pdf
    text_extraction_method: ocrmypdf_tesseract_force_ocr
    ocr_status: human_reviewed_with_minor_errors
    ocr_pages_reviewed: [21, 22, 23]
    ocr_pages_to_review: [42]
    quality_note: >-
      Main body reads coherently and technical terminology, section headings and page order
      were manually checked. Minor OCR artifacts remain. Tesseract emitted a poor-OCR/diacritics
      warning for page 42, which still needs a spot check before final acceptance.

# A repeated CSB archive page points to the same 2020 Bio-Lab report (DocumentId 6330).
# The catalog builder groups it by document ID/hash and preserves both source URLs as aliases.
# It must NOT create a second incident from the misleading archive-page title.
known_alias_groups:
  - document_id: CSB-6330
    investigation_id: 2020-05-I-LA
    canonical_title: Chemical Reaction, Decomposition, and Toxic Gas Release at Bio-Lab, Inc.
    incident_ids: [BIOLAB_LAKE_CHARLES_2020]
    source_detail_urls:
      - https://www.csb.gov/bio-lab-conyers-chemical-release-/
      - https://www.csb.gov/bio-lab-lake-charles-chemical-fire-and-release-/
    note: >-
      Both archive entries resolve to the same 125-page report for the August 27, 2020 event
      in Westlake, Louisiana. Keep one document and one incident; do not treat the Conyers
      archive label as a separate 2020 incident.


