version: 1

# Identifier handling rules:
# - investigation_id preserves the year width and sequence width printed on the PDF cover;
# - dots are normalized to hyphens and OCR'd state letters are uppercased;
# - recommendation_match_key is a separate join key: 2-digit years are expanded using
#   the pivot below and sequence numbers are converted to integers (e.g. 98-007 -> 1998-7).
report_id_policy:
  two_digit_year_pivot: 30
  preserve_report_id_sequence_width: true

# Explicit source-specific corrections and registrations; these are configuration overrides, not a document-review queue.
# The manifest remains the immutable record of the website collection run;
# this file adds curation without rewriting collection history.
manual_documents:
