project:
  name: industrial-incident-analyst
  dataset_version: csb_snapshot_2026-11-10

sources:
  investigations_index: https://www.csb.gov/investigations/completed-investigations/
  recommendations_page: https://www.csb.gov/recommendations/statistics/

collection:
  max_pages: 20
  max_reports: 100
  request_delay_seconds: 0.7
  timeout_seconds: 45
  download_reports: true
  download_recommendations_xlsx: true

selection:
  # The first collection pass records every detail page. Reports without a clearly
  # labelled final investigation report PDF remain in the manifest but are not
  # silently treated as final reports.
  require_final_report_pdf_for_analysis: true
